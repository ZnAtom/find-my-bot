apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: foundit-uploads-pvc
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: foundit-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: foundit-model-cache-pvc
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: foundit-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundit-backend
  labels:
    app: foundit-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foundit-backend
  template:
    metadata:
      labels:
        app: foundit-backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: ghcr.io/znatom/find-my-bot-backend:latest
          env:
            - name: DB_USER
              value: "appuser"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foundit-db-secret
                  key: postgres_password
            - name: DB_NAME
              value: "lostfound"
            - name: DB_HOST
              value: "foundit-db"
            - name: HF_ENDPOINT
              value: "https://hf-mirror.com"
            - name: SCHOOL_API_URL
              value: "https://genaiapi.shanghaitech.edu.cn/api/v1/start"
            - name: SCHOOL_VISION_MODEL
              value: "GPT-5.5"
            - name: SCHOOL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: foundit-genai
                  key: school_api_key
            - name: UPLOAD_RATE_LIMIT_COUNT
              value: "20"
            - name: UPLOAD_RATE_LIMIT_WINDOW_SECONDS
              value: "3600"
            - name: IMAGE_ANALYSIS_RATE_LIMIT_COUNT
              value: "10"
            - name: IMAGE_ANALYSIS_RATE_LIMIT_WINDOW_SECONDS
              value: "3600"
            - name: HF_HOME
              value: "/root/.cache/huggingface"
            - name: CASDOOR_ENDPOINT
              value: "https://auth.geekpie.club"
            - name: CASDOOR_REDIRECT_URI
              value: "https://foundit.geekpie.club/api/auth/callback"
            - name: FRONTEND_BASE_URL
              value: "https://foundit.geekpie.club"
            - name: AUTH_COOKIE_SECURE
              value: "1"
            - name: OAUTH_STATE_EXPIRE_SECONDS
              value: "1800"
            - name: CORS_ORIGINS
              value: "https://foundit.geekpie.club"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://foundit.geekpie.club"
            - name: CASDOOR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: foundit-casdoor
                  key: client_id
            - name: CASDOOR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: foundit-casdoor
                  key: client_secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: foundit-casdoor
                  key: jwt_secret
            - name: QQ_BOT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: foundit-qq-bot
                  key: service_token
                  optional: true
            - name: QQ_SUPPORT_RATE_LIMIT_COUNT
              value: "60"
            - name: QQ_IMAGE_SEARCH_RATE_LIMIT_COUNT
              value: "20"
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - mountPath: /app/uploads
              name: uploads
            - mountPath: /root/.cache/huggingface
              name: model-cache
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: foundit-uploads-pvc
        - name: model-cache
          persistentVolumeClaim:
            claimName: foundit-model-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: foundit-backend
  labels:
    app: foundit-backend
spec:
  ports:
    - port: 8000
      targetPort: http
  selector:
    app: foundit-backend
