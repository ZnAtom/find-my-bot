apiVersion: apps/v1
kind: Deployment
metadata:
  name: findmybot-backend
  labels:
    app: findmybot-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: findmybot-backend
  template:
    metadata:
      labels:
        app: findmybot-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/znatom/find-my-bot-backend:latest
          env:
            - name: DATABASE_URL
              value: "postgresql://appuser:password@findmybot-db:5432/lostfound"
            # Add other env vars here if needed
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - mountPath: /app/uploads
              name: uploads
      volumes:
        - name: uploads
          emptyDir: {} # Ephemeral for now, use PVC if persistent uploads are needed
---
apiVersion: v1
kind: Service
metadata:
  name: findmybot-backend
  labels:
    app: findmybot-backend
spec:
  ports:
    - port: 8000
      targetPort: http
  selector:
    app: findmybot-backend
