apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: foundit-uploads-pvc
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: foundit-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: foundit-model-cache-pvc
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: foundit-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundit-backend
  labels:
    app: foundit-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foundit-backend
  template:
    metadata:
      labels:
        app: foundit-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/znatom/find-my-bot-backend:latest
          env:
            - name: DATABASE_URL
              value: "postgresql://appuser:password@foundit-db:5432/lostfound"
            - name: DB_USER
              value: "appuser"
            - name: DB_PASSWORD
              value: "password"
            - name: DB_NAME
              value: "lostfound"
            - name: DB_HOST
              value: "foundit-db"
            - name: HF_ENDPOINT
              value: "https://hf-mirror.com"
            - name: HF_HOME
              value: "/root/.cache/huggingface"
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - mountPath: /app/uploads
              name: uploads
            - mountPath: /root/.cache/huggingface
              name: model-cache
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: foundit-uploads-pvc
        - name: model-cache
          persistentVolumeClaim:
            claimName: foundit-model-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: foundit-backend
  labels:
    app: foundit-backend
spec:
  ports:
    - port: 8000
      targetPort: http
  selector:
    app: foundit-backend
