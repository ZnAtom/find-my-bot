apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundit-backend
  labels:
    app: foundit-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foundit-backend
  template:
    metadata:
      labels:
        app: foundit-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/znatom/find-my-bot-backend:latest
          env:
            - name: DATABASE_URL
              value: "postgresql://appuser:password@foundit-db:5432/lostfound"
            - name: DB_USER
              value: "appuser"
            - name: DB_PASSWORD
              value: "password"
            - name: DB_NAME
              value: "lostfound"
            - name: DB_HOST
              value: "foundit-db"
            - name: HF_ENDPOINT
              value: "https://hf-mirror.com"
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - mountPath: /app/uploads
              name: uploads
      volumes:
        - name: uploads
          emptyDir: {} # Ephemeral for now, use PVC if persistent uploads are needed
---
apiVersion: v1
kind: Service
metadata:
  name: foundit-backend
  labels:
    app: foundit-backend
spec:
  ports:
    - port: 8000
      targetPort: http
  selector:
    app: foundit-backend
