apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- db.yaml
- frontend.yaml
- backend.yaml
- ingress.yaml

# These image tags will be replaced dynamically by the CI/CD pipeline
images:
- name: ghcr.io/znatom/find-my-bot-db
  newTag: latest
- name: ghcr.io/znatom/find-my-bot-frontend
  newTag: latest
- name: ghcr.io/znatom/find-my-bot-backend
  newTag: latest
