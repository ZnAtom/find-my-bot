apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foundit-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Adjust proxy body size if you have large file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: foundit.geekpie.club # Replace with your actual domain later
      http:
        paths:
          # Route /api to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: foundit-backend
                port:
                  number: 8000
          # Route everything else to frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: foundit-frontend
                port:
                  number: 5173
