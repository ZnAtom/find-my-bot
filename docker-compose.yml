services:
  db:
    build: .
    container_name: findmybot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lostfound
      HF_LOCAL_ONLY: "1"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U appuser -d lostfound" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: findmybot-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://appuser:password@db:5432/lostfound
      - DB_USER=appuser
      - DB_PASSWORD=password
      - DB_NAME=lostfound
      - DB_HOST=db
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: findmybot-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/.env.development:/app/.env.development
      - ./frontend/.env.production:/app/.env.production
      - ./frontend/index.html:/app/index.html
    networks:
      - app-network
