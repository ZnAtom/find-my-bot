services:
  napcat:
    image: ${NAPCAT_IMAGE:-m.daocloud.io/docker.io/mlikiowa/napcat-docker:latest}
    container_name: foundit-napcat
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
      NAPCAT_GID: "${NAPCAT_GID:-1000}"
      ACCOUNT: "${NAPCAT_ACCOUNT:-}"
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/data:/app/.config/QQ
    ports:
      - "127.0.0.1:6099:6099"
    networks:
      - qqbot-network

  astrbot:
    image: ${ASTRBOT_IMAGE:-m.daocloud.io/docker.io/soulter/astrbot:latest}
    container_name: foundit-astrbot
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./astrbot/data:/AstrBot/data
      - ./astrbot/plugins/foundit:/AstrBot/data/plugins/astrbot_plugin_foundit:ro
    ports:
      - "127.0.0.1:6185:6185"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - napcat
    networks:
      - qqbot-network

networks:
  qqbot-network:
    driver: bridge
