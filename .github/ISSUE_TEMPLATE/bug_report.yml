name: 🐛 Bug Report (提交 Bug)
description: 提交您在使用过程中遇到的 Bug，帮助我们改善项目
title: "[Bug] <简短描述问题>"
labels: ["bug"]
assignees:
  - ZnAtom
body:
  - type: markdown
    attributes:
      value: |
        感谢您提交 Bug 反馈！在提交前，请确保您已经搜索了 [Issues](https://github.com/ZnAtom/find-my-bot/issues) 看是否已经有人提出过类似的问题。
  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 发生了什么错误？您期望发生什么？
      placeholder: 请在此清晰地描述您遇到的问题。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 我们该如何复现这个 Bug？
      placeholder: |
        1. 运行 '...'
        2. 点击 '....'
        3. 滚动到 '....'
        4. 出现错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 您原本期望看到什么现象？
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 部署环境
      description: 您是在什么环境下遇到此问题的？
      options:
        - Docker 一键部署
        - Kubernetes 生产环境
        - 本地直接运行 (Conda/Node)
        - 其他
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 附加上下文 / 截图 / 日志
      description: 请提供任何有助于我们定位问题的日志（如 docker compose logs）或截图。
    validations:
      required: false
