name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  REGISTRY: ghcr.io
  GITHUB_ACTOR: ${{ github.actor }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Check for changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            db:
              - 'Dockerfile'
              - 'init.sql'
  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
        uses: actions/checkout@v4
      
      - name: Set up Python
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        if: needs.changes.outputs.backend == 'true'
        run: |
          cd backend
          pip install -r requirements.txt
          
      - name: Run Backend tests
        if: needs.changes.outputs.backend == 'true'
        run: |
          cd backend
          PYTHONPATH=. pytest tests/

      - name: Set up Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Frontend tests
        if: needs.changes.outputs.frontend == 'true'
        run: |
          cd frontend
          npm install
          npm run test
          
  build-and-push:
    needs: [changes, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for pushing K8s yaml updates if using GitOps
      packages: write # Needed to push images to ghcr.io

    steps:
      - name: Checkout repository
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.db == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Downcase REPO
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for DB
        if: needs.changes.outputs.db == 'true'
        id: meta-db
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}-db
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push DB Docker image
        if: needs.changes.outputs.db == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-db.outputs.tags }}
          labels: ${{ steps.meta-db.outputs.labels }}

      - name: Extract metadata (tags, labels) for Frontend
        if: needs.changes.outputs.frontend == 'true'
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend Docker image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Extract metadata (tags, labels) for Backend
        if: needs.changes.outputs.backend == 'true'
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend Docker image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Set up Kustomize
        if: github.event_name != 'pull_request'
        uses: imranismail/setup-kustomize@v2

      - name: Update K8s Manifests with new Image Tags
        if: github.event_name != 'pull_request' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.db == 'true')
        run: |
          cd k8s
          if [ "${{ needs.changes.outputs.frontend }}" == "true" ]; then
            kustomize edit set image ghcr.io/${{ env.REPO }}-frontend=ghcr.nju.edu.cn/${{ env.REPO }}-frontend:sha-${{ github.sha }}
          fi
          if [ "${{ needs.changes.outputs.backend }}" == "true" ]; then
            kustomize edit set image ghcr.io/${{ env.REPO }}-backend=ghcr.nju.edu.cn/${{ env.REPO }}-backend:sha-${{ github.sha }}
          fi
          if [ "${{ needs.changes.outputs.db }}" == "true" ]; then
            kustomize edit set image ghcr.io/${{ env.REPO }}-db=ghcr.nju.edu.cn/${{ env.REPO }}-db:sha-${{ github.sha }}
          fi
      - name: Commit and push K8s manifest changes (GitOps)
        if: github.event_name != 'pull_request' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.db == 'true')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "chore(cd): update image tags to sha-${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin develop
          git push

      # === DEPLOYMENT OPTIONS ===
      # OPTION A: If you install a GitHub Self-Hosted Runner on your K8s node, uncomment this:
      # - name: Deploy to Local K8s (Self-Hosted Runner)
      #   if: github.event_name != 'pull_request'
      #   run: |
      #     kubectl apply -k k8s/

      # OPTION B: If you use ArgoCD (GitOps), ArgoCD will automatically detect the commit we just pushed above!
      # No further action needed here.
